[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "a11yhat"
version = "0.1.0"
description = "a11yhat: a WCAG 2.2 accessibility machine, structured by POUR — four crew leads, every success criterion a recorded check. A hardHats crew."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Vincent Gonzalez" }]
keywords = ["accessibility", "wcag", "a11y", "section508", "audit", "pour"]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
  "Operating System :: OS Independent",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/vince-gonzalez/a11yhat"
Repository = "https://github.com/vince-gonzalez/a11yhat"

[project.scripts]
a11yhat = "a11yhat.run:main"

[tool.setuptools]
packages = ["a11yhat"]

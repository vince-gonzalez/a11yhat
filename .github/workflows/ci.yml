name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: self-tests
        run: python -m unittest discover -s tests -v
      - name: run the machine on a sample
        run: |
          printf '<!doctype html><html lang="en"><head><title>T</title></head><body><main><h1>Hi</h1><img src=a.jpg alt="a cat"></main></body></html>' > /tmp/ok.html
          python -m hardhats /tmp/ok.html
